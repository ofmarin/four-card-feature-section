<!-- I think the card could be a flex, but the icon should be a grid
It could be a flex and just push icon to the end.
I do want to practice grids. but it might be unnecesary and I could just
use grids to organize the cards.-->


<article [class] = borderColor()  id="card">

  <div id="content">
    <h3 id="title">{{card().title}}</h3>
    <p id="description">{{card().description}}</p>
  </div>

  <div>
  <figure id="icon">
    <img src="{{card().icon}}" alt="">
  </figure>
  </div>
</article>
